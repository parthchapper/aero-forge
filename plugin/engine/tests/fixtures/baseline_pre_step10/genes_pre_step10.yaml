# Genome rows: u in [0,1] -> lo + u (hi - lo) for float, choices[min(floor(u n), n - 1)] for choice.
# Units are in the gene name suffix. Order defines the genome vector.
genes:
  - {name: fam_sweep_deg, kind: float, lo: 0, hi: 35, meaning: "family quarter-chord sweep magnitude; sign per surface"}
  - {name: fam_taper, kind: float, lo: 0.3, hi: 1.0, meaning: "family tip/root chord ratio"}
  - {name: fam_dihedral_deg, kind: float, lo: -4, hi: 8, meaning: "family dihedral added to every surface cant"}
  - {name: fam_tip_style, kind: choice, choices: ["square", "rounded", "raked"], meaning: "family tip treatment"}
  - {name: fam_airfoil, kind: choice, choices: ["naca00", "naca24", "naca44", "naca33"], meaning: "NACA 4-digit camber family: naca<camber %><position tenths>"}
  - {name: fam_tc, kind: float, lo: 0.08, hi: 0.15, meaning: "family thickness/chord"}
  - {name: fam_body_fineness, kind: float, lo: 4, hi: 10, meaning: "body length / max diameter"}
  - {name: fam_body_section_exp, kind: float, lo: 2, hi: 5, meaning: "super-ellipse exponent of body sections (2 ellipse, higher boxier)"}
  - {name: s0_root_x_frac, kind: float, lo: 0.3, hi: 0.6, meaning: "root mid-chord station along host length"}
  - {name: s0_root_z_frac, kind: float, lo: -1, hi: 1, meaning: "root height within host half-height"}
  - {name: s0_area_weight, kind: float, lo: 0.6, hi: 1.0, meaning: "share of lifting area before normalisation"}
  - {name: s0_aspect_ratio, kind: float, lo: 4, hi: 12, meaning: "aspect ratio (b^2/A of the mirrored pair)"}
  - {name: s0_sweep_sign, kind: choice, choices: ["aft", "forward"], meaning: "sign applied to family sweep"}
  - {name: s0_sweep_delta_deg, kind: float, lo: -8, hi: 8, meaning: "bounded delta on family sweep"}
  - {name: s0_cant_deg, kind: float, lo: -6, hi: 6, meaning: "inner panel cant added to family dihedral; +90 fin up"}
  - {name: s0_break_frac, kind: float, lo: 0.3, hi: 1.0, meaning: "break station / semi-span; >= break_none_frac means no break"}
  - {name: s0_outer_cant_delta_deg, kind: float, lo: -45, hi: 80, meaning: "outer panel cant relative to inner"}
  - {name: s0_outer_sweep_delta_deg, kind: float, lo: -15, hi: 25, meaning: "outer panel sweep relative to inner"}
  - {name: s0_control_frac, kind: float, lo: 0.0, hi: 0.35, meaning: "control chord fraction; below control_min_chord_frac means none"}
  - {name: s1_active, kind: choice, choices: ["off", "on"], meaning: "surface present"}
  - {name: s1_host, kind: choice, choices: ["centre", "pod"], meaning: "root host: centre body (or surface0 centre) or pod pair"}
