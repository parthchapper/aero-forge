# Reference configurations (SPEC §8 baseline, §9 reference set): name -> sparse gene overrides.
# Values are physical (genes.yaml units) or choice labels; unlisted float genes take the middle of
# their range and unlisted choice genes their first label. `base: <name>` starts from that entry.
conventional:
  fam_sweep_deg: 0.0
  fam_taper: 0.6
  fam_dihedral_deg: 3.0
  fam_tip_style: square
  fam_airfoil: naca24
  fam_tc: 0.12
  fam_body_fineness: 7.0
  fam_body_section_exp: 2.5
  s0_root_x_frac: 0.5
  s0_root_z_frac: 0.6
  s0_area_weight: 1.0
  s0_aspect_ratio: 8.0
  s0_sweep_sign: aft
  s0_sweep_delta_deg: 0.0
  s0_cant_deg: 0.0
  s0_break_frac: 1.0
  s0_outer_cant_delta_deg: 0.0
  s0_outer_sweep_delta_deg: 0.0
  s0_control_frac: 0.25
  s1_active: "on"
  s1_host: centre
  s1_root_x_frac: 0.93
  s1_root_z_frac: 0.0
  s1_area_weight: 0.38
  s1_aspect_ratio: 4.5
  s1_sweep_sign: aft
  s1_sweep_delta_deg: 0.0
  s1_cant_deg: -3.0
  s1_break_frac: 1.0
  s1_outer_cant_delta_deg: 0.0
  s1_outer_sweep_delta_deg: 0.0
  s1_tip_join: none
  s1_control_frac: 0.35
  s2_active: "on"
  s2_host: centre
  s2_root_x_frac: 0.92
  s2_root_z_frac: 0.3
  s2_area_weight: 0.12
  s2_aspect_ratio: 2.0
  s2_sweep_sign: aft
  s2_sweep_delta_deg: 8.0
  s2_cant_deg: 87.0
  s2_break_frac: 1.0
  s2_outer_cant_delta_deg: 0.0
  s2_outer_sweep_delta_deg: 0.0
  s2_tip_join: none
  s2_control_frac: 0.25
  s3_active: "off"
  body_on: "on"
  body_length_frac: 0.75
  pods_on: "off"
  prop_pattern: centre
  prop_direction: tractor
  prop_gap_frac: 0.3
  prop_z_frac: 0.0
